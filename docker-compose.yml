services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       sharing_excess
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - se_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL:             postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sharing_excess
      SECRET_KEY:               ${SECRET_KEY:?set SECRET_KEY in .env (32+ random chars)}
      CORS_ORIGIN:              http://localhost
      CLOUDINARY_CLOUD_NAME:    ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY:       ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET:    ${CLOUDINARY_API_SECRET:-}
      MAIL_HOST:                ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:                ${MAIL_PORT:-465}
      MAIL_USERNAME:            ${MAIL_USERNAME:-}
      MAIL_PASSWORD:            ${MAIL_PASSWORD:-}
      MAIL_FROM_NAME:           Sharing Excess
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8003:8003"   # Swagger docs from this machine only; the public reaches the API through nginx
    networks:
      - se_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_APP_ROOT_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - se_net

volumes:
  postgres_data:
  uploads_data:

networks:
  se_net:
    driver: bridge
